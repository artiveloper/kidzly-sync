name: Playground Sync (Daily)

on:
  schedule:
    # 04:30~20:30 KST, 2시간 간격 하루 9회 재시도 (delta와 동일한 재시도 밀도)
    # safemap.go.kr가 간헐적으로 실패하므로 성공할 때까지 하루 여러 번 시도. 이미 성공한 날은 앱이 스킵함.
    # 04:30~08:30 KST = 19,21,23시 UTC(전날) / 10:30~20:30 KST = 1,3,5,7,9,11시 UTC
    # 분을 :30으로 두어 :00에 도는 delta(짝수시)·full(홀수시) 슬롯과 절대 겹치지 않는다.
    - cron: '30 19,21,23,1,3,5,7,9,11 * * *'
  workflow_dispatch:

jobs:
  playground-sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
            build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Write prod config
        run: echo "${{ secrets.APP_PROD_YML }}" > src/main/resources/application-prod.yml

      - name: Build jar
        run: ./gradlew bootJar -x test --build-cache

      - name: Run playground sync
        run: java -jar build/libs/*.jar --spring.profiles.active=prod
        env:
          SPRING_MAIN_WEB_APPLICATION_TYPE: none
          SYNC_JOB: PLAYGROUND
          SAFEMAP_SERVICE_KEY: ${{ secrets.SAFEMAP_SERVICE_KEY }}
