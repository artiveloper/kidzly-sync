[alembic]
script_location = migrations
prepend_sys_path = .
# 미지정 시 공백·쉼표·콜론으로 쪼개는 옛 방식으로 떨어지며 경고가 뜬다 (향후 제거 예정)
path_separator = os
# 리비전 파일명은 생성 날짜 + 설명으로 고정한다 (Flyway 의 V번호 순서를 눈으로 좇던 습관을 유지)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = Asia/Seoul

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
