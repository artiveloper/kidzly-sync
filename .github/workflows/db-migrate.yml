name: DB Migrate

# 손으로만 돌린다. 예전에는 Flyway 가 배치 부팅 때 함께 돌아, 스키마 변경이 그날 가장 먼저
# 뜨는 cron 에 얹혀 나갔다 — 언제 반영될지 예측할 수 없었다. 이제는 사람이 시점을 정한다.
#
# 시크릿은 전부 Infisical이 단일 출처다. 인증은 OIDC라 Infisical 자격증명을 어디에도
# 저장하지 않는다 — GitHub이 잡 시작 시 발급한 단기 토큰으로 교환한다. 그래서
# `permissions: id-token: write`가 없으면 토큰 자체가 발급되지 않아 먼저 실패한다.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: '적용할 리비전 (기본 head)'
        required: false
        default: 'head'
        type: string

concurrency:
  # 마이그레이션이 겹치면 스키마가 어느 리비전인지 알 수 없게 된다. 큐잉하되 취소는 안 한다.
  group: db-migrate-production
  cancel-in-progress: false

env:
  INFISICAL_DOMAIN: ${{ vars.INFISICAL_DOMAIN || 'https://app.infisical.com' }}
  INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG || 'prod' }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Infisical OIDC

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Infisical 스텝보다 먼저 값 유무를 본다. 비어 있으면 액션이
      # "Missing identity ID for OIDC auth"라는 원인을 알기 어려운 메시지로 죽는데,
      # 실제 원인은 대개 Variables가 아니라 Secrets 탭에 넣은 것이다.
      - name: Infisical 설정 확인
        env:
          IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID || secrets.INFISICAL_IDENTITY_ID }}
          PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
        run: |
          fail=0
          [ -n "$IDENTITY_ID" ]  || { echo "::error::INFISICAL_IDENTITY_ID 가 비어 있습니다. Settings → Secrets and variables → Actions 의 Variables(또는 Secrets) 탭에 등록하세요."; fail=1; }
          [ -n "$PROJECT_SLUG" ] || { echo "::error::INFISICAL_PROJECT_SLUG 가 비어 있습니다."; fail=1; }
          exit $fail

      - name: Infisical — DB 접속 정보
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID || secrets.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG || secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_DOMAIN }}
          secret-path: /

      # 적용 전후를 로그에 남긴다. 어느 리비전에서 어디로 갔는지가 사고 때 첫 단서다.
      - name: Show current revision
        run: uv run --frozen --extra migrations alembic current

      - name: Upgrade
        run: uv run --frozen --extra migrations alembic upgrade "${{ inputs.revision }}"

      - name: Show resulting revision
        run: uv run --frozen --extra migrations alembic current
